# docker-compose.yml - spins up the two datastores the engine talks to.
#
#   docker compose up -d        # start Postgres + Redis in the background
#   docker compose down         # stop them
#   docker compose down -v      # stop AND wipe the stored data
#
# The connection settings below match the defaults baked into persistence_demo,
# so once these are up you can just build and run the demo with no extra config.
services:
  postgres:
    image: postgres:16-alpine
    container_name: trading_postgres
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs schema.sql automatically the FIRST time the database is created,
      # so the tables exist before you run anything. (The engine also creates
      # them itself, so this is belt-and-suspenders.)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: trading_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
